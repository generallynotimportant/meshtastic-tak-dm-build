+    /**
+     * Pick the mesh destination for an outbound v2 packet: the recipient's node for directed traffic whose addressees
+     * all sit behind one known node, otherwise broadcast. Decodes our own wire payload so the decision uses exactly
+     * what receivers will see. Payloads over [MAX_UNICAST_TAK_WIRE_PAYLOAD_BYTES] stay broadcast, because firmware
+     * PKI-encrypts unicast (+12 bytes) and rejects the packet as TOO_LARGE rather than falling back.
+     */
+    private fun resolveV2Destination(wirePayload: ByteArray): String {
+        if (wirePayload.size > MAX_UNICAST_TAK_WIRE_PAYLOAD_BYTES) return NodeAddress.ID_BROADCAST
+        val recipients =
+            try {
+                TakRecipients.of(TakV2Compressor.decompressToData(wirePayload))
+            } catch (e: Exception) {
+                Logger.w(e) { "Could not decode outbound TAK packet for routing; broadcasting" }
+                return NodeAddress.ID_BROADCAST
+            }
+        val ownNode = nodeRepository.myNodeInfo.value?.myNodeNum
+        val node = directedRouter.unicastTargetFor(recipients, ownNode) ?: return NodeAddress.ID_BROADCAST
+        return NodeAddress.numToDefaultId(node)
+    }
+
+    /** Remember which UIDs/callsigns belong to the ATAK user(s) on this phone, for receive-side filtering. */
