+package org.meshtastic.core.takserver
+
+import org.meshtastic.tak.TakPacketV2Data
+import kotlin.test.Test
+import kotlin.test.assertEquals
+import kotlin.test.assertFalse
+import kotlin.test.assertNull
+import kotlin.test.assertTrue
+import kotlin.time.Duration.Companion.minutes
+import kotlin.time.Instant
+
+class TakDirectedRouterTest {
+
+    private var clock = Instant.fromEpochSeconds(1_000_000)
+    private fun router() = TakDirectedRouter(peerTtl = 30.minutes, now = { clock })
+
+    private val nodeA = 0x0a0a0a0a
+    private val nodeB = 0x0b0b0b0b
+    private val nodeMe = 0x0c0c0c0c
+
+    private fun pli(uid: String, callsign: String) =
+        TakPacketV2Data(cotTypeStr = "a-f-G-U-C", uid = uid, callsign = callsign, payload = TakPacketV2Data.Payload.Pli())
+
+    private fun dm(fromUid: String, toUid: String, toCallsign: String?) = TakPacketV2Data(
+        cotTypeStr = "b-t-f",
+        uid = "GeoChat.$fromUid.$toUid.abc123",
+        marti = listOfNotNull(toCallsign),
+        payload = TakPacketV2Data.Payload.Chat(message = "hi", to = toUid),
+    )
+
+    private fun allChat(fromUid: String) = TakPacketV2Data(
+        cotTypeStr = "b-t-f",
+        uid = "GeoChat.$fromUid.All Chat Rooms.m1",
+        payload = TakPacketV2Data.Payload.Chat(message = "hi all", to = null),
+    )
+
+    @Test
+    fun `recipients extracted from DM and broadcast chat`() {
+        val r = TakRecipients.of(dm("ANDROID-me", "ANDROID-a", "ALPHA"))
+        assertEquals(setOf("ANDROID-a"), r.uids)
+        assertEquals(setOf("ALPHA"), r.callsigns)
+        assertTrue(TakRecipients.of(allChat("ANDROID-me")).isBroadcast)
+        assertTrue(TakRecipients.of(pli("ANDROID-a", "ALPHA")).isBroadcast)
+    }
+
+    @Test
+    fun `DM to known peer is unicast to that node`() {
+        val r = router()
+        r.learnPeer(nodeA, pli("ANDROID-a", "ALPHA"))
+        assertEquals(nodeA, r.unicastTargetFor(TakRecipients.of(dm("ANDROID-me", "ANDROID-a", "ALPHA")), nodeMe))
+    }
+
+    @Test
+    fun `DM to unknown peer stays broadcast`() {
+        val r = router()
+        assertNull(r.unicastTargetFor(TakRecipients.of(dm("ANDROID-me", "ANDROID-a", "ALPHA")), nodeMe))
+    }
+
+    @Test
+    fun `stale peer mapping falls back to broadcast`() {
+        val r = router()
+        r.learnPeer(nodeA, pli("ANDROID-a", "ALPHA"))
+        clock += 31.minutes
+        assertNull(r.unicastTargetFor(TakRecipients.of(dm("ANDROID-me", "ANDROID-a", "ALPHA")), nodeMe))
+    }
+
+    @Test
+    fun `recipients on two different nodes stay broadcast`() {
+        val r = router()
+        r.learnPeer(nodeA, pli("ANDROID-a", "ALPHA"))
+        r.learnPeer(nodeB, pli("ANDROID-b", "BRAVO"))
+        val group = TakRecipients(uids = setOf("team-room"), callsigns = setOf("ALPHA", "BRAVO"))
+        assertNull(r.unicastTargetFor(group, nodeMe))
+    }
+
+    @Test
+    fun `peer that moved radios is unicast to the newest node`() {
+        val r = router()
+        r.learnPeer(nodeA, pli("ANDROID-a", "ALPHA"))
+        r.learnPeer(nodeB, pli("ANDROID-a", "ALPHA"))
+        assertEquals(nodeB, r.unicastTargetFor(TakRecipients.of(dm("ANDROID-me", "ANDROID-a", "ALPHA")), nodeMe))
+    }
+
+    @Test
+    fun `never unicast to our own node`() {
+        val r = router()
+        r.learnPeer(nodeMe, pli("ANDROID-a", "ALPHA"))
+        assertNull(r.unicastTargetFor(TakRecipients.of(dm("ANDROID-x", "ANDROID-a", "ALPHA")), nodeMe))
+    }
+
+    @Test
+    fun `peer learned from GeoChat sender uid`() {
+        val r = router()
+        r.learnPeer(nodeA, dm("ANDROID-a", "ANDROID-me", "ME"))
+        assertEquals(nodeA, r.unicastTargetFor(TakRecipients(setOf("ANDROID-a"), emptySet()), nodeMe))
+    }
+
+    @Test
+    fun `DM addressed to me is delivered`() {
+        val r = router()
+        r.learnLocal("ANDROID-me", "ME")
+        assertTrue(r.shouldDeliverLocally(TakRecipients.of(dm("ANDROID-a", "ANDROID-me", "ME"))))
+    }
+
